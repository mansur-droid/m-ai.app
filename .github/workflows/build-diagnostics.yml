name: Next.js security upgrade verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate package lock
        run: npm install
      - name: Run strict TypeScript check
        run: npm run typecheck
      - name: Run Next.js production build
        run: npm run build
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: next-15.5.21-package-lock
          path: package-lock.json
