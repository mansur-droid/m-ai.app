name: Production build verification

on:
  push:
    branches: [verify-production-cleanup]
    paths-ignore:
      - 'package-lock.json'
      - 'ci/production-build-verification.txt'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install from lockfile
        run: npm ci
      - name: Run strict TypeScript check
        run: npm run typecheck
      - name: Run Next.js production build
        run: npm run build
      - name: Record successful verification
        run: |
          mkdir -p ci
          {
            echo "Commit: $GITHUB_SHA"
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "npm ci: PASS"
            echo "npm run typecheck: PASS"
            echo "npm run build: PASS"
          } > ci/production-build-verification.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json ci/production-build-verification.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record verified production build [skip ci]"
          git push
