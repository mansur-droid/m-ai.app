name: Next.js security upgrade verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate package lock
        run: npm install
      - name: Run strict TypeScript check
        run: npm run typecheck
      - name: Run Next.js production build
        run: npm run build
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "security: regenerate lockfile for Next.js 15.5.21 [skip ci]"
          git push
