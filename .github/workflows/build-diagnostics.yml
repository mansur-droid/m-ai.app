name: Build diagnostics

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ci/build-report.txt'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run strict typecheck and production build
        shell: bash
        run: |
          set +e
          {
            echo "Commit: $GITHUB_SHA"
            echo
            echo "=== npm run typecheck ==="
            npm run typecheck
            TYPECHECK_EXIT=$?
            echo
            echo "=== npm run build ==="
            npm run build
            BUILD_EXIT=$?
            echo
            echo "TYPECHECK_EXIT=$TYPECHECK_EXIT"
            echo "BUILD_EXIT=$BUILD_EXIT"
          } 2>&1 | tee /tmp/build-report.txt
          exit 0
      - name: Publish diagnostic report
        run: |
          mkdir -p ci
          cp /tmp/build-report.txt ci/build-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/build-report.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: publish latest build diagnostics"
          git push
