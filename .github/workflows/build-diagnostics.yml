name: Next.js 15.5.21 security verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate dependency graph
        run: npm install
      - name: Confirm patched framework version
        run: node -e "const p=require('./node_modules/next/package.json'); if(p.version!=='15.5.21'){throw new Error('Expected next 15.5.21, got '+p.version)}; console.log('next',p.version)"
      - name: Run strict TypeScript check
        run: npm run typecheck
      - name: Run Next.js production build
        run: npm run build
